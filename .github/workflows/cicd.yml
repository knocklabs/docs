name: Docs CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Install yarn
        run: |
          YARN_VERSION="$(awk '$1 == "yarn" { print $2 }' .tool-versions)"
          test -n "$YARN_VERSION"
          npm install -g "yarn@$YARN_VERSION"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate OpenAPI specs
        run: yarn validate-openapi

      - name: Generate LLMs content
        run: yarn generate-llms

      - name: Test Markdown content negotiation
        run: yarn test:markdown-routing

      - name: Type check
        run: yarn run type-check

      - name: Test 404 search result handling
        run: node --import tsx scripts/testRelatedPages.cjs

      - name: Test deep merge
        run: yarn test:deep-merge

      - name: Lint code
        run: yarn run lint

      - name: Check formatting
        run: yarn run format.check
