# yaml-language-server: $schema=https://app.stainless.com/config.schema.json

organization:
  name: knock mgmt
  docs: https://docs.knock.app/mapi
  contact: support@knock.app
targets:
  typescript:
    package_name: "@knocklabs/mgmt"
    production_repo: knocklabs/knock-mgmt-node
    publish:
      npm:
        auth_method: oidc
      release:
        branch: main
        prerelease: false
    staging_repo: knocklabs/knock-mgmt-node-staging
  python:
    package_name: knock_mapi
    production_repo: knocklabs/knock-mgmt-python
    publish:
      pypi: false
      release:
        branch: main
        prerelease: true
    staging_repo: knocklabs/knock-mgmt-python-staging
  go:
    package_name: knock-mapi
    production_repo: knocklabs/knock-mgmt-go
    options:
      enable_v2: true
    staging_repo: knocklabs/knock-mgmt-go-staging
    publish:
      release:
        branch: main
        prerelease: false
  # Undocumented target that emits a processed OpenAPI spec rather than an SDK.
  # `files` maps output filename, `transforms` applies the `openapi.transforms`
  # below, `code-samples` injects the `openapi.code_samples` snippets. Setting
  # `files` replaces the default outputs.
  #
  # `skip: true` keeps this target out of default/auto builds. This target has no
  # `production_repo` on purpose — we don't want stlc/Stainless to push it
  # anywhere; the `publish-documented-spec` workflow builds it explicitly and
  # pushes the spec to knocklabs/docs itself. Without `skip`, the Stainless cloud
  # auto-build tries to push this repo-less target and reports "push failed".
  #
  # `skip` only affects default (`all`) builds — an explicit target still builds:
  #   stlc build -t openapi   (won't touch the SDK targets' repos/custom code)
  openapi:
    skip: true
    options:
      files:
        openapi.documented.json:
          with: [ transforms, code-samples ]
environments:
  production: https://control.knock.app
resources:
  $shared:
    models:
      page_info: "#/components/schemas/PageInfo"
      message_type_boolean_field: "#/components/schemas/MessageTypeBooleanField"
      message_type_button_field: "#/components/schemas/MessageTypeButtonField"
      message_type_image_field: "#/components/schemas/MessageTypeImageField"
      message_type_url_field: "#/components/schemas/MessageTypeUrlField"
      message_type_json_field: "#/components/schemas/MessageTypeJsonField"
      message_type_markdown_field: "#/components/schemas/MessageTypeMarkdownField"
      message_type_multi_select_field: "#/components/schemas/MessageTypeMultiSelectField"
      message_type_select_field: "#/components/schemas/MessageTypeSelectField"
      message_type_text_field: "#/components/schemas/MessageTypeTextField"
      message_type_textarea_field: "#/components/schemas/MessageTypeTextareaField"
      message_type_color_field: "#/components/schemas/MessageTypeColorField"
      message_type_number_field: "#/components/schemas/MessageTypeNumberField"
      message_type_list_field: "#/components/schemas/MessageTypeListField"
      recipient_reference: "#/components/schemas/RecipientReference"
      goal_attachment: "#/components/schemas/GoalAttachment"
  templates:
    models:
      chat_template: "#/components/schemas/ChatTemplate"
      email_template: "#/components/schemas/EmailTemplate"
      push_template: "#/components/schemas/PushTemplate"
      sms_template: "#/components/schemas/SmsTemplate"
      in_app_feed_template: "#/components/schemas/InAppFeedTemplate"
      request_template: "#/components/schemas/RequestTemplate"
      webhook_template: "#/components/schemas/WebhookTemplate"
    methods:
      preview: post /v1/templates/preview
  email_layouts:
    models:
      email_layout: "#/components/schemas/EmailLayout"
      email_layout_request: "#/components/schemas/EmailLayoutRequest"
      branding_overrides: "#/components/schemas/BrandingOverrides"
    methods:
      list:
        endpoint: get /v1/email_layouts
      retrieve:
        endpoint: get /v1/email_layouts/{email_layout_key}
      upsert:
        endpoint: put /v1/email_layouts/{email_layout_key}
      validate:
        endpoint: put /v1/email_layouts/{email_layout_key}/validate
      preview: post /v1/email_layouts/preview
  commits:
    models:
      commit: "#/components/schemas/Commit"
    methods:
      list: get /v1/commits
      commit_all: put /v1/commits
      retrieve: get /v1/commits/{id}
      promote_all: put /v1/commits/promote
      promote_one: put /v1/commits/{id}/promote
  partials:
    models:
      # NOTE: Rename Partial for TS only to avoid a conflict.
      partial:
        openapi_uri: "#/components/schemas/Partial"
        skip: [ typescript ]
      partial_resource:
        openapi_uri: "#/components/schemas/Partial"
        only: [ typescript ]
      partial_request: "#/components/schemas/PartialRequest"
    methods:
      list:
        endpoint: get /v1/partials
      retrieve:
        endpoint: get /v1/partials/{partial_key}
      upsert:
        endpoint: put /v1/partials/{partial_key}
      validate:
        endpoint: put /v1/partials/{partial_key}/validate
      preview: post /v1/partials/preview
  translations:
    models:
      translation: "#/components/schemas/Translation"
      translation_request: "#/components/schemas/TranslationRequest"
    methods:
      list:
        endpoint: get /v1/translations
      retrieve:
        endpoint: get /v1/translations/{locale_code}
      upsert:
        endpoint: put /v1/translations/{locale_code}
      validate:
        endpoint: put /v1/translations/{locale_code}/validate
  workflows:
    models:
      condition: "#/components/schemas/Condition"
      condition_group: "#/components/schemas/ConditionGroup"
      duration: "#/components/schemas/Duration"
      send_window: "#/components/schemas/SendWindow"
      workflow: "#/components/schemas/Workflow"
      workflow_step: "#/components/schemas/WorkflowStep"
      workflow_batch_step: "#/components/schemas/WorkflowBatchStep"
      workflow_branch_step: "#/components/schemas/WorkflowBranchStep"
      workflow_chat_step: "#/components/schemas/WorkflowChatStep"
      workflow_in_app_feed_step: "#/components/schemas/WorkflowInAppFeedStep"
      workflow_in_app_guide_step: "#/components/schemas/WorkflowInAppGuideStep"
      workflow_email_step: "#/components/schemas/WorkflowEmailStep"
      workflow_push_step: "#/components/schemas/WorkflowPushStep"
      workflow_sms_step: "#/components/schemas/WorkflowSmsStep"
      workflow_webhook_step: "#/components/schemas/WorkflowWebhookStep"
      workflow_delay_step: "#/components/schemas/WorkflowDelayStep"
      workflow_fetch_step: "#/components/schemas/WorkflowFetchStep"
      workflow_throttle_step: "#/components/schemas/WorkflowThrottleStep"
      workflow_trigger_workflow_step: "#/components/schemas/WorkflowTriggerWorkflowStep"
      workflow_random_cohort_step: "#/components/schemas/WorkflowRandomCohortStep"
      workflow_random_cohort_step_branch: "#/components/schemas/WorkflowRandomCohortStepBranch"
      workflow_update_data_step: "#/components/schemas/WorkflowUpdateDataStep"
      workflow_update_user_step: "#/components/schemas/WorkflowUpdateUserStep"
      workflow_update_tenant_step: "#/components/schemas/WorkflowUpdateTenantStep"
      workflow_update_object_step: "#/components/schemas/WorkflowUpdateObjectStep"
      workflow_ai_agent_step: "#/components/schemas/WorkflowAIAgentStep"
      inline_identify_user_request: "#/components/schemas/InlineIdentifyUserRequest"
      workflow_request: "#/components/schemas/WorkflowRequest"
      condition_group_all_match: "#/components/schemas/ConditionGroupAllMatch"
    methods:
      list:
        endpoint: get /v1/workflows
      retrieve:
        endpoint: get /v1/workflows/{workflow_key}
      upsert:
        endpoint: put /v1/workflows/{workflow_key}
      activate:
        endpoint: put /v1/workflows/{workflow_key}/activate
      run:
        endpoint: put /v1/workflows/{workflow_key}/run
      validate:
        endpoint: put /v1/workflows/{workflow_key}/validate
    subresources:
      steps:
        methods:
          preview_template:
            endpoint: post /v1/workflows/{workflow_key}/steps/{step_ref}/preview_template
  message_types:
    models:
      message_type: "#/components/schemas/MessageType"
      message_type_variant: "#/components/schemas/MessageTypeVariant"
      message_type_request: "#/components/schemas/MessageTypeRequest"
    methods:
      list:
        endpoint: get /v1/message_types
      retrieve:
        endpoint: get /v1/message_types/{message_type_key}
      upsert:
        endpoint: put /v1/message_types/{message_type_key}
      validate:
        endpoint: put /v1/message_types/{message_type_key}/validate
  auth:
    methods:
      verify: get /v1/whoami
  api_keys:
    methods:
      exchange: post /v1/api_keys/exchange
  channel_groups:
    models:
      channel_group: "#/components/schemas/ChannelGroup"
      channel_group_rule: "#/components/schemas/ChannelGroupRule"
    methods:
      list: get /v1/channel_groups
      retrieve:
        endpoint: get /v1/channel_groups/{channel_group_key}
      upsert:
        endpoint: put /v1/channel_groups/{channel_group_key}
      delete:
        endpoint: delete /v1/channel_groups/{channel_group_key}
  channels:
    models:
      channel: "#/components/schemas/Channel"
      channel_environment_settings: "#/components/schemas/ChannelEnvironmentSettings"
      chat_channel_settings: "#/components/schemas/ChatChannelSettings"
      email_channel_settings: "#/components/schemas/EmailChannelSettings"
      push_channel_settings: "#/components/schemas/PushChannelSettings"
      sms_channel_settings: "#/components/schemas/SmsChannelSettings"
      in_app_feed_channel_settings: "#/components/schemas/InAppFeedChannelSettings"
    methods:
      list: get /v1/channels
      retrieve: get /v1/channels/{channel_key}
  members:
    models:
      member: "#/components/schemas/Member"
      member_user: "#/components/schemas/MemberUser"
    methods:
      list: get /v1/members
      retrieve: get /v1/members/{id}
      delete: delete /v1/members/{id}
  data_sources:
    models:
      source: "#/components/schemas/Source"
      source_request: "#/components/schemas/SourceRequest"
      source_preprocess_script: "#/components/schemas/SourcePreprocessScript"
      source_environment_settings: "#/components/schemas/SourceEnvironmentSettings"
      source_event: "#/components/schemas/SourceEvent"
      source_events_response: "#/components/schemas/SourceEventsResponse"
      source_event_action_mapping: "#/components/schemas/SourceEventActionMapping"
      source_log: "#/components/schemas/SourceLog"
      source_log_action: "#/components/schemas/SourceLogAction"
      source_logs_response: "#/components/schemas/SourceLogsResponse"
      source_provider_response: "#/components/schemas/SourceProviderResponse"
      source_providers_response: "#/components/schemas/SourceProvidersResponse"
      source_rehearse_request: "#/components/schemas/SourceRehearseRequest"
      source_rehearse_response: "#/components/schemas/SourceRehearseResponse"
      source_status_response: "#/components/schemas/SourceStatusResponse"
      sources_response: "#/components/schemas/SourcesResponse"
    methods:
      list_sources:
        endpoint: get /v1/sources
        paginated: false
      retrieve: get /v1/sources/{key}
      upsert: put /v1/sources/{key}
      retrieve_status: get /v1/sources/{key}/status
      rehearse: post /v1/sources/{key}/rehearse
      list_events:
        endpoint: get /v1/sources/{key}/events
        paginated: false
      list_logs: get /v1/sources/{key}/logs
      list_providers: get /v1/source_providers
      retrieve_provider: get /v1/source_providers/{key}
  environments:
    models:
      environment: "#/components/schemas/Environment"
    methods:
      list: get /v1/environments
      retrieve: get /v1/environments/{environment_slug}
  variables:
    models:
      variable: "#/components/schemas/Variable"
    methods:
      list: get /v1/variables
      retrieve: get /v1/variables/{key}
  guides:
    models:
      guide: "#/components/schemas/Guide"
      guide_step: "#/components/schemas/GuideStep"
      guide_activation_url_pattern: "#/components/schemas/GuideActivationUrlPattern"
      guide_request: "#/components/schemas/GuideRequest"
    methods:
      list:
        endpoint: get /v1/guides
      retrieve:
        endpoint: get /v1/guides/{guide_key}
      archive:
        endpoint: delete /v1/guides/{guide_key}
      upsert:
        endpoint: put /v1/guides/{guide_key}
      validate:
        endpoint: put /v1/guides/{guide_key}/validate
      activate:
        endpoint: put /v1/guides/{guide_key}/activate
  branches:
    models:
      branch: "#/components/schemas/Branch"
    methods:
      list: get /v1/branches
      delete: delete /v1/branches/{branch_slug}
      retrieve: get /v1/branches/{branch_slug}
      create: post /v1/branches/{branch_slug}
      rebase: put /v1/branches/{branch_slug}/rebase
  broadcasts:
    models:
      broadcast_request: "#/components/schemas/BroadcastRequest"
      broadcast: "#/components/schemas/Broadcast"
    methods:
      send: put /v1/broadcasts/{broadcast_key}/send
      validate: put /v1/broadcasts/{broadcast_key}/validate
      list: get /v1/broadcasts
      retrieve: get /v1/broadcasts/{broadcast_key}
      upsert: put /v1/broadcasts/{broadcast_key}
      cancel: put /v1/broadcasts/{broadcast_key}/cancel
  audiences:
    models:
      audience: "#/components/schemas/Audience"
      dynamic_audience: "#/components/schemas/DynamicAudience"
      static_audience: "#/components/schemas/StaticAudience"
      audience_condition: "#/components/schemas/AudienceCondition"
      audience_request: "#/components/schemas/AudienceRequest"
    methods:
      archive: delete /v1/audiences/{audience_key}
      retrieve: get /v1/audiences/{audience_key}
      upsert: put /v1/audiences/{audience_key}
      validate: put /v1/audiences/{audience_key}/validate
      list: get /v1/audiences
  goals:
    methods:
      list: get /v1/goals
      archive: delete /v1/goals/{goal_key}
      retrieve: get /v1/goals/{goal_key}
      upsert: put /v1/goals/{goal_key}
      validate: put /v1/goals/{goal_key}/validate
      clone: post /v1/goals/{goal_key}/clone
    models:
      goal_condition: "#/components/schemas/GoalCondition"
      goal_request: "#/components/schemas/GoalRequest"
      goal: "#/components/schemas/Goal"
  assets:
    methods:
      list: get /v1/assets
    models:
      asset: "#/components/schemas/Asset"
  tags:
    methods:
      delete: delete /v1/tags/{name}
      upsert: put /v1/tags/{name}
      list: get /v1/tags
    models:
      tag: "#/components/schemas/Tag"
  schemas:
    methods:
      list:
        endpoint: get /v1/schemas
        paginated: false
      retrieve: get /v1/schemas/{item_type}
      upsert: put /v1/schemas/{item_type}
      validate: put /v1/schemas/{item_type}/validate
    models:
      item_schema: "#/components/schemas/ItemSchema"
  preference_center:
    methods:
      retrieve: get /v1/preference_center
      upsert: put /v1/preference_center
      reset: put /v1/preference_center/reset
  billing:
    methods:
      retrieve_summary: get /v1/billing/summary
    models:
      billing_summary: "#/components/schemas/BillingSummary"
  preference_categories:
    methods:
      list: get /v1/preference_categories
      delete: delete /v1/preference_categories/{name}
      upsert: put /v1/preference_categories/{name}
    models:
      preference_category: "#/components/schemas/PreferenceCategory"
settings:
  disable_mock_tests: true
  license: Apache-2.0
pagination:
  - name: entries_cursor
    type: cursor
    request:
      after:
        type: string
        x-stainless-pagination-property:
          purpose: next_cursor_param
      before:
        type: string
        x-stainless-pagination-property:
          purpose: previous_cursor_param
      limit:
        type: integer
    response:
      entries:
        type: array
        items:
          type: object
      page_info:
        type: object
        properties:
          after:
            type: string
            x-stainless-pagination-property:
              purpose: next_cursor_field
client_settings:
  opts:
    service_token:
      type: string
      nullable: false
      auth:
        security_scheme: BearerAuth
      read_env: KNOCK_SERVICE_TOKEN
openapi:
  code_samples:
    stainless: true
  # NOTE: A suggested workaround from Stainless to get around a bug in stlc with
  # how `format: time` is handled in Go.
  transforms:
    - command: remove
      reason: drop time format to work around Go build errors
      args:
        target: "$..properties[?(@ && @.type === 'string' && @.format === 'time')]"
        keys: [ "format" ]
query_settings:
  nested_format: brackets
  array_format: brackets
readme:
  example_requests:
    default:
      type: request
      endpoint: get /v1/workflows
      params:
        environment: development
    headline:
      type: request
      endpoint: get /v1/workflows
      params:
        environment: development
    pagination:
      type: request
      endpoint: get /v1/workflows
      params:
        environment: development
